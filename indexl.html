<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>罗氏测评与题库复习系统</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --primary: #0066cc;
      --primary-dark: #004c99;
      --primary-light: #e6f0fa;
      --success: #07c160;
      --success-light: #e8f8ef;
      --danger: #fa5151;
      --danger-light: #feecec;
      --warning: #ff9900;
      --text-main: #1f2d3d;
      --text-sub: #5c6b77;
      --text-muted: #8c9ba5;
      --bg-page: #f4f7f9;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(0, 102, 204, 0.06);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #0b192c;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .system-container {
      width: 100%;
      max-width: 1280px;
      height: 94vh;
      display: flex;
      gap: 24px;
      padding: 16px;
    }

    .desktop-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
    }
    .panel-brand h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .panel-brand p { font-size: 14px; color: #94a3b8; }

    .qr-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: center;
    }
    .qr-box {
      width: 170px;
      height: 170px;
      background: #fff;
      padding: 10px;
      border-radius: var(--radius-sm);
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-card h3 { font-size: 15px; margin-bottom: 6px; }
    .qr-card p { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
    .btn-group { display: flex; gap: 8px; justify-content: center; }
    .btn-outline {
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: transparent;
      color: #fff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.15); }

    .phone-simulator {
      width: 440px;
      max-width: 100%;
      height: 100%;
      background: var(--bg-page);
      border-radius: 40px;
      border: 10px solid #1e293b;
      box-shadow: var(--shadow-md), 0 0 0 2px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .wx-capsule-bar {
      height: 48px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }
    .app-title-mini { font-size: 15px; font-weight: 600; color: var(--text-main); }
    .wx-capsule {
      display: flex;
      align-items: center;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.85);
      gap: 8px;
    }
    .capsule-btn { font-size: 12px; cursor: pointer; color: #333; }

    .role-switch-container {
      background: #fff;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .role-pill-group {
      display: flex;
      background: var(--bg-page);
      border-radius: 20px;
      padding: 3px;
      width: 100%;
    }
    .role-pill {
      flex: 1;
      text-align: center;
      padding: 7px 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .role-pill.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 102, 204, 0.25);
    }

    .screen-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      position: relative;
    }

    .mode-select-card {
      background: #fff;
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.15s ease;
    }
    .mode-select-card:active { transform: scale(0.98); }
    .mode-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-right: 14px;
    }
    .mode-info h4 { font-size: 16px; margin-bottom: 4px; color: var(--text-main); }
    .mode-info p { font-size: 12px; color: var(--text-muted); }

    .module-filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .module-filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 5px 12px;
      font-size: 12px;
      background: #e2e8f0;
      border-radius: 14px;
      white-space: nowrap;
      cursor: pointer;
      color: #475569;
    }
    .filter-chip.active {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    .quiz-card {
      background: #fff;
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }
    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-single { background: #e0f2fe; color: #0284c7; }
    .badge-multi { background: #fef3c7; color: #d97706; }
    .badge-judge { background: #f3e8ff; color: #9333ea; }
    .badge-fill { background: #fce7f3; color: #db2777; }
    .q-index-text { font-size: 13px; color: var(--text-muted); font-weight: 600; }

    .question-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text-main);
      margin-bottom: 18px;
    }

    .option-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .option-item {
      display: flex;
      align-items: flex-start;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.45;
      transition: all 0.15s ease;
    }
    .option-item:hover { border-color: var(--primary); }
    .option-item.selected {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 500;
    }
    .option-item.correct {
      background: var(--success-light) !important;
      border-color: var(--success) !important;
      color: #0d6832 !important;
      font-weight: 600;
    }
    .option-item.wrong {
      background: var(--danger-light) !important;
      border-color: var(--danger) !important;
      color: #991b1b !important;
    }
    .option-code {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .fill-box {
      margin-bottom: 16px;
      padding: 14px;
      background: #f8fafc;
      border-radius: var(--radius-sm);
      border: 1px dashed var(--border-color);
    }
    .fill-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .explain-card {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 14px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .explain-card.correct-border { border-left-color: var(--success); }
    .explain-card.wrong-border { border-left-color: var(--danger); }
    .explain-title { font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }

    .bottom-bar {
      padding: 12px 16px;
      background: #fff;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }
    .btn-main {
      flex: 1;
      background: var(--primary);
      color
