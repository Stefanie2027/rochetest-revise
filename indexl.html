<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>罗氏考核与复习测评系统</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --primary: #0066cc;
      --primary-dark: #004c99;
      --primary-light: #e6f0fa;
      --success: #07c160;
      --success-light: #e8f8ef;
      --danger: #fa5151;
      --danger-light: #feecec;
      --warning: #ff9900;
      --text-main: #1f2d3d;
      --text-sub: #5c6b77;
      --text-muted: #8c9ba5;
      --bg-page: #f4f7f9;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(0, 102, 204, 0.06);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #0b192c;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .system-container {
      width: 100%;
      max-width: 1280px;
      height: 94vh;
      display: flex;
      gap: 24px;
      padding: 16px;
    }

    .desktop-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
    }
    .panel-brand h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .panel-brand p { font-size: 14px; color: #94a3b8; }

    .qr-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: center;
    }
    .qr-box {
      width: 170px;
      height: 170px;
      background: #fff;
      padding: 10px;
      border-radius: var(--radius-sm);
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-card h3 { font-size: 15px; margin-bottom: 6px; }
    .qr-card p { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
    .btn-group { display: flex; gap: 8px; justify-content: center; }
    .btn-outline {
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: transparent;
      color: #fff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.15); }

    .phone-simulator {
      width: 430px;
      max-width: 100%;
      height: 100%;
      background: var(--bg-page);
      border-radius: 40px;
      border: 10px solid #1e293b;
      box-shadow: var(--shadow-md), 0 0 0 2px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .wx-capsule-bar {
      height: 48px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }
    .app-title-mini { font-size: 15px; font-weight: 600; color: var(--text-main); }
    .wx-capsule {
      display: flex;
      align-items: center;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.85);
      gap: 8px;
    }
    .capsule-btn { font-size: 12px; cursor: pointer; color: #333; }

    .role-switch-container {
      background: #fff;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .role-pill-group {
      display: flex;
      background: var(--bg-page);
      border-radius: 20px;
      padding: 3px;
      width: 100%;
    }
    .role-pill {
      flex: 1;
      text-align: center;
      padding: 7px 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .role-pill.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 102, 204, 0.25);
    }

    .screen-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      position: relative;
    }

    .mode-select-card {
      background: #fff;
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.15s ease;
    }
    .mode-select-card:active { transform: scale(0.98); }
    .mode-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-right: 14px;
    }
    .mode-info h4 { font-size: 16px; margin-bottom: 4px; color: var(--text-main); }
    .mode-info p { font-size: 12px; color: var(--text-muted); }

    .quiz-card {
      background: #fff;
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }
    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-single { background: #e0f2fe; color: #0284c7; }
    .badge-multi { background: #fef3c7; color: #d97706; }
    .badge-judge { background: #f3e8ff; color: #9333ea; }
    .badge-fill { background: #fce7f3; color: #db2777; }
    .q-index-text { font-size: 13px; color: var(--text-muted); font-weight: 600; }

    .question-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text-main);
      margin-bottom: 18px;
    }

    .option-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .option-item {
      display: flex;
      align-items: flex-start;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.45;
      transition: all 0.15s ease;
    }
    .option-item:hover { border-color: var(--primary); }
    .option-item.selected {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 500;
    }
    .option-item.correct {
      background: var(--success-light) !important;
      border-color: var(--success) !important;
      color: #0d6832 !important;
      font-weight: 600;
    }
    .option-item.wrong {
      background: var(--danger-light) !important;
      border-color: var(--danger) !important;
      color: #991b1b !important;
    }
    .option-code {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .fill-box {
      margin-bottom: 16px;
      padding: 14px;
      background: #f8fafc;
      border-radius: var(--radius-sm);
      border: 1px dashed var(--border-color);
    }
    .fill-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .explain-card {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 14px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .explain-card.correct-border { border-left-color: var(--success); }
    .explain-card.wrong-border { border-left-color: var(--danger); }
    .explain-title { font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }

    .bottom-bar {
      padding: 12px 16px;
      background: #fff;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }
    .btn-main {
      flex: 1;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 22px;
      padding: 11px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn-main:active { opacity: 0.9; }
    .btn-secondary {
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 11px 18px;
      font-size: 14px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      body { background: var(--bg-page); }
      .system-container { padding: 0; height: 100vh; }
      .desktop-panel { display: none; }
      .phone-simulator {
        width: 100%;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

<div class="system-container">
  <!-- 桌面辅助面板 -->
  <div class="desktop-panel">
    <div>
      <div class="panel-brand">
        <h1>罗氏双轨题库测评系统</h1>
        <p>已固化：渠道岗（120题）+ 生态岗题库</p>
      </div>
      <div style="margin-top: 24px; font-size: 13px; color: #cbd5e1; line-height: 1.8;">
        <p>• <b>渠道岗</b>：涵盖布局、供应、商业合规、商业运营、折扣与数据全套题目</p>
        <p>• <b>生态岗</b>：涵盖战略、HR合规、准入考题及新业极核心考点</p>
        <p>• <b>模式</b>：每题单页展示，提供「背题复习」与「实战测验」双模式</p>
      </div>
    </div>

    <div class="qr-card">
      <div class="qr-box" id="qrcode"></div>
      <h3 id="qr-label">微信扫码答题</h3>
      <p id="qr-url-text">https://stefanie2027.github.io/rochetest-revise/</p>
      <div class="btn-group">
        <button class="btn-outline" onclick="copyShareUrl()">复制链接</button>
        <button class="btn-outline" onclick="downloadQRCode()">保存二维码</button>
      </div>
    </div>
  </div>

  <!-- 移动端容器 -->
  <div class="phone-simulator">
    <!-- 胶囊顶栏 -->
    <div class="wx-capsule-bar">
      <span class="app-title-mini" id="top-title">岗位考试测评</span>
      <div class="wx-capsule">
        <span class="capsule-btn" onclick="goHome()">🏠 首页</span>
        <span style="color:#cbd5e1;">|</span>
        <span class="capsule-btn" onclick="toggleMode()">切模式</span>
      </div>
    </div>

    <!-- 岗位切换器 -->
    <div class="role-switch-container">
      <div class="role-pill-group">
        <div class="role-pill active" id="pill-channel" onclick="switchRole('channel')">渠道岗 (120题)</div>
        <div class="role-pill" id="pill-eco" onclick="switchRole('eco')">生态岗</div>
      </div>
    </div>

    <!-- 主展示区 -->
    <div class="screen-body" id="screen-body"></div>

    <!-- 底部按钮区 -->
    <div class="bottom-bar" id="bottom-bar"></div>
  </div>
</div>

<script>
// ================= 渠道岗与生态岗题库数据全量内嵌 =================
const QUESTION_DATABASE = {
  // 渠道岗题目（汇整自 6 份专属 Word 试卷共 120 题）
  channel: [
    // 1. 渠道布局
    {
      module: "渠道布局",
      type: "multi",
      title: "药店布局产品勾选应遵循什么原则？",
      options: ["为了节约老板审批次数，尽量勾全产品以避免未来重复审批", "与8大TA沟通好，有明确患者需求的再勾选", "外包产品原则上非必要不布局"],
      answer: "BC",
      explain: "考点解析：药店布局原则要求必须有明确患者需求，同时外包产品非必要不布局。"
    },
    {
      module: "渠道布局",
      type: "fill",
      title: "艾满欣药店布局申请邮件通过后可以直接进系统申请吗？如果不是，应在_________流程之后才可以系统申请。",
      options: [],
      answer: "否，应先经过新业极的配液资质审核后才能申请",
      explain: "考点解析：艾满欣需先经过新业极配液资质审核通过后才可在系统正式申请。"
    },
    {
      module: "渠道布局",
      type: "fill",
      title: "2025年哪些产品不能勾选调拨折扣？________，但在__________________业务场景下，在非___________的_______级商上可以勾选。",
      options: [],
      answer: "艾满欣、泰圣奇、优罗华、罗视佳、赫双妥；医院配送一级商向二级商调拨场景；同集团；二级商",
      explain: "考点解析：明确调拨折扣五大受限产品及特定二级商调拨例外场景。"
    },
    {
      module: "渠道布局",
      type: "fill",
      title: "店联体药店新增产品布局时，布局产品___________母店产品范围。",
      options: [],
      answer: "不能超过",
      explain: "考点解析：店联体新增范围受母店严格约束，绝不能超过母店产品范围。"
    },
    {
      module: "渠道布局",
      type: "fill",
      title: "新开户药店如果想经营速福达，能否布局？________（Y/N）。若要经营，应该向_________拿货。",
      options: [],
      answer: "N；华润山东（或华润商贸）",
      explain: "考点解析：速福达零售进货遵循专属总代供货通路。"
    },
    {
      module: "渠道布局",
      type: "judge",
      title: "NRDL布局时审批过定为“规划”的商业，在实际发生业务需求时，是否需要发邮件走审批流程后才可以进系统申请？",
      options: ["Y (是)", "N (否)"],
      answer: "B",
      explain: "考点解析：已审批为规划的商业无需再邮件审批，可直接系统申请。"
    },
    {
      module: "渠道布局",
      type: "single",
      title: "医院要求出商业配送函时，我确认配送商业与已审批的布局一致时，下一步我就可以________",
      options: ["走盖章流程", "获得大区审批后走盖章流程", "获得大区审批，渠道策略与运营团队复核后，走盖章流程"],
      answer: "C",
      explain: "考点解析：出配送函必须经过大区审批与渠道策略与运营团队双重复核。"
    },
    {
      module: "渠道布局",
      type: "single",
      title: "店联体药店开户过程中，提交系统申请时以下哪个不是需要上传的扫描件？",
      options: ["营业执照（加盖药店公章）", "药品经营许可证（加盖药店公章）", "一级商出具的店联体承诺函（加盖一级商公章）", "信息数据合规承诺函（每页加盖药店公章）", "业务伙伴合规承诺函（加盖药店公章）"],
      answer: "E",
      explain: "考点解析：店联体开户仅需一级商承诺函，不需要单独的业务伙伴合规承诺函。"
    },
    {
      module: "渠道布局",
      type: "multi",
      title: "FY25罗盘项目包含哪些产品？",
      options: ["赫双妥", "帕捷特", "赫赛汀", "赫赛汀（皮下注射）", "赫赛莱"],
      answer: "ABCD",
      explain: "考点解析：FY25 罗盘项目涵盖赫双妥、帕捷特、赫赛汀及皮下注射制剂。"
    },
    {
      module: "渠道布局",
      type: "single",
      title: "福达万家项目FY25合作周期的时间范围是？",
      options: ["2025年1月1日-2025年12月31日", "2025年1月1日-2026年3月31日", "2025年4月1日-2026年3月31日", "2025年4月1日-2025年12月31日"],
      answer: "C",
      explain: "考点解析：FY25 福达万家合作周期为 2025年4月1日至2026年3月31日。"
    },

    // 2. 渠道供应运营
    {
      module: "渠道供应",
      type: "single",
      title: "以下哪个不属于商业补货预测发布邮件中涉及特定产品信息分享？",
      options: ["公司在发近效期药品(效期短于300天)", "产品信息变更预计一个月内供货药品", "特殊订单适用的产品范围", "近效期药品库存处置沟通函"],
      answer: "D",
      explain: "考点解析：近效期库存处置沟通函不属于常规补货预测发布范围。"
    },
    {
      module: "渠道供应",
      type: "single",
      title: "以下哪项不是经销商提升授信额度的措施：",
      options: ["承兑汇票", "Waiver审批", "担保合同", "质押票据"],
      answer: "A",
      explain: "考点解析：承兑汇票是支付结算方式，不属于提升授信额度的措施。"
    },
    {
      module: "渠道供应",
      type: "multi",
      title: "以下哪些情况适用于特殊订单范围？",
      options: ["流感季速福达供货", "新进NRDL6个月内产品供货", "有供应短缺风险采取精准分货", "新上市6个月内产品供货", "为配合班车路线订单发货延后"],
      answer: "ABCD",
      explain: "考点解析：特殊订单涵盖流感季供货、新进医保、精准分货及新上市特定周期供货。"
    },
    {
      module: "渠道供应",
      type: "fill",
      title: "罗氏发运时效，常规空运到货时间为（ ）小时内。",
      options: [],
      answer: "48",
      explain: "考点解析：常规空运服务时效承诺为 48 小时内抵达。"
    },
    {
      module: "渠道供应",
      type: "fill",
      title: "罗氏账期客户标准回款时间为（ ）天。",
      options: [],
      answer: "45",
      explain: "考点解析：标准账期管理回款时效为 45 天。"
    },

    // 3. 商业合规
    {
      module: "商业合规",
      type: "single",
      title: "MCE对经销商及药店开展审计的频率至少是：",
      options: ["每季度", "每半年", "每年", "按需"],
      answer: "C",
      explain: "考点解析：合规审计要求对经销商及药店至少每年开展一次常规审计。"
    },
    {
      module: "商业合规",
      type: "single",
      title: "若存在进销存数据差异，MCE采取相应必要措施，包括聘请第三方进行审计和（ ）",
      options: ["资质审核", "实地盘库", "人员访谈", "流程验证"],
      answer: "B",
      explain: "考点解析：进销存差异核查的核心抓手包括实地盘库与第三方审计。"
    },
    {
      module: "商业合规",

// ================= 应用状态管理 =================
let currentRole = "channel"; // 'channel' | 'eco'
let currentMode = "home";    // 'home' | 'study' | 'quiz' | 'result'
let currentIndex = 0;
let userAnswers = {};
let hasSubmitted = {};

function getCurrentBank() {
  return QUESTION_DATABASE[currentRole] || [];
}

// 岗位切换
function switchRole(role) {
  currentRole = role;
  document.getElementById("pill-channel").className = role === 'channel' ? "role-pill active" : "role-pill";
  document.getElementById("pill-eco").className = role === 'eco' ? "role-pill active" : "role-pill";
  goHome();
}

// 返回首页
function goHome() {
  currentMode = "home";
  currentIndex = 0;
  userAnswers = {};
  hasSubmitted = {};
  renderHome();
}

// 切换模式（复习 vs 测验）
function toggleMode() {
  if (currentMode === "study") {
    startQuiz();
  } else {
    startStudy();
  }
}

// 渲染首页
function renderHome() {
  const bank = getCurrentBank();
  const roleName = currentRole === 'channel' ? "渠道岗" : "生态岗";
  document.getElementById("top-title").innerText = `${roleName}测评系统`;

  const html = `
    <div style="background:linear-gradient(135deg, #0066cc, #0284c7); padding:20px; border-radius:var(--radius-md); color:#fff; margin-bottom:16px;">
      <h3 style="font-size:18px; margin-bottom:6px;">${roleName} 专业题库</h3>
      <p style="font-size:13px; opacity:0.9;">当前题量：<b>${bank.length}</b> 题 (单选/多选/判断/填空)</p>
    </div>

    <div class="mode-select-card" onclick="startStudy()">
      <div style="display:flex; align-items:center;">
        <div class="mode-icon" style="background:#e0f2fe; color:#0284c7;">📖</div>
        <div class="mode-info">
          <h4>复习背题板块</h4>
          <p>每页一题，直出正确答案与官方深度解析</p>
        </div>
      </div>
      <span style="color:#94a3b8; font-size:18px;">➔</span>
    </div>

    <div class="mode-select-card" onclick="startQuiz()">
      <div style="display:flex; align-items:center;">
        <div class="mode-icon" style="background:#fef3c7; color:#d97706;">✍️</div>
        <div class="mode-info">
          <h4>测验考核板块</h4>
          <p>自主作答，提交后即时判分并高亮正解</p>
        </div>
      </div>
      <span style="color:#94a3b8; font-size:18px;">➔</span>
    </div>
  `;
  document.getElementById("screen-body").innerHTML = html;
  document.getElementById("bottom-bar").innerHTML = `<button class="btn-main" onclick="startStudy()">立即开始复习</button>`;
}

function startStudy() {
  currentMode = "study";
  currentIndex = 0;
  renderQuestion();
}

function startQuiz() {
  currentMode = "quiz";
  currentIndex = 0;
  userAnswers = {};
  hasSubmitted = {};
  renderQuestion();
}

// 渲染单个题目页面
function renderQuestion() {
  const bank = getCurrentBank();
  if (currentIndex >= bank.length) {
    if (currentMode === "quiz") return renderQuizResult();
    currentIndex = 0;
  }
  const q = bank[currentIndex];
  const isStudy = currentMode === "study";
  const isSubmitted = hasSubmitted[currentIndex] || false;
  const userAns = userAnswers[currentIndex] || "";

  document.getElementById("top-title").innerText = `${isStudy ? "背题复习" : "测验作答"} (${currentIndex + 1}/${bank.length})`;

  let typeBadge = `<span class="badge-tag badge-single">单选题</span>`;
  if (q.type === 'multi') typeBadge = `<span class="badge-tag badge-multi">多选题</span>`;
  if (q.type === 'judge') typeBadge = `<span class="badge-tag badge-judge">判断题</span>`;
  if (q.type === 'fill') typeBadge = `<span class="badge-tag badge-fill">填空题</span>`;

  let contentHtml = `
    <div class="quiz-card">
      <div class="question-header">
        <div>${typeBadge} <span style="font-size:11px; color:#64748b; margin-left:4px;">${q.module}</span></div>
        <span class="q-index-text">${currentIndex + 1} / ${bank.length}</span>
      </div>
      <div class="question-title">${q.title}</div>
  `;

  // 选项或填空输入
  if (q.type === 'fill') {
    contentHtml += `
      <div class="fill-box">
        <input type="text" class="fill-input" id="fill-val" placeholder="请输入你的答案..." 
          value="${userAns}" ${isSubmitted || isStudy ? 'disabled' : ''} oninput="recordFill(this.value)" />
      </div>
    `;
  } else {
    contentHtml += `<div class="option-list">`;
    q.options.forEach((opt, idx) => {
      const code = String.fromCharCode(65 + idx);
      let cls = "option-item";

      if (isStudy) {
        // 复习模式直接高亮标准答案
        if (q.answer.includes(code)) cls += " correct";
      } else if (isSubmitted) {
        // 测验提交后对比
        if (q.answer.includes(code)) cls += " correct";
        else if (userAns.includes(code)) cls += " wrong";
      } else {
        if (userAns.includes(code)) cls += " selected";
      }

      contentHtml += `
        <div class="${cls}" onclick="handleOptionClick('${code}')">
          <div class="option-code">${code}</div>
          <div>${opt}</div>
        </div>
      `;
    });
    contentHtml += `</div>`;
  }

  // 解析区域（复习模式直接展示；测验模式提交后展示）
  if (isStudy || isSubmitted) {
    let borderCls = isStudy ? "" : (userAns === q.answer ? "correct-border" : "wrong-border");
    contentHtml += `
      <div class="explain-card ${borderCls}">
        <div class="explain-title">
          <span>🎯 正确答案：<b>${q.answer}</b></span>
        </div>
        <div style="color:#475569; margin-top:4px;">${q.explain}</div>
      </div>
    `;
  }

  contentHtml += `</div>`;
  document.getElementById("screen-body").innerHTML = contentHtml;

  // 底部按钮渲染
  renderBottomBar(bank.length, isStudy, isSubmitted);
}

function handleOptionClick(code) {
  if (currentMode === "study" || hasSubmitted[currentIndex]) return;
  const q = getCurrentBank()[currentIndex];
  let cur = userAnswers[currentIndex] || "";

  if (q.type === "multi") {
    if (cur.includes(code)) {
      cur = cur.replace(code, "");
    } else {
      cur = (cur + code).split("").sort().join("");
    }
  } else {
    cur = code;
  }
  userAnswers[currentIndex] = cur;
  renderQuestion();
}

function recordFill(val) {
  userAnswers[currentIndex] = val.trim();
}

function renderBottomBar(total, isStudy, isSubmitted) {
  let barHtml = "";
  if (isStudy) {
    barHtml = `
      <button class="btn-secondary" onclick="prevQ()" ${currentIndex === 0 ? 'disabled' : ''}>上一题</button>
      <button class="btn-main" onclick="nextQ()">${currentIndex === total - 1 ? '完成复习' : '下一题'}</button>
    `;
  } else {
    if (!isSubmitted) {
      barHtml = `<button class="btn-main" onclick="submitCurrentQ()">确认提交答案</button>`;
    } else {
      barHtml = `
        <button class="btn-secondary" onclick="prevQ()" ${currentIndex === 0 ? 'disabled' : ''}>上一题</button>
        <button class="btn-main" onclick="nextQ()">${currentIndex === total - 1 ? '查看答题成绩' : '下一题'}</button>
      `;
    }
  }
  document.getElementById("bottom-bar").innerHTML = barHtml;
}

function submitCurrentQ() {
  const ans = userAnswers[currentIndex];
  if (!ans) {
    alert("请先选择或输入答案！");
    return;
  }
  hasSubmitted[currentIndex] = true;
  renderQuestion();
}

function nextQ() {
  const bank = getCurrentBank();
  if (currentIndex < bank.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    if (currentMode === "quiz") {
      renderQuizResult();
    } else {
      alert("🎉 恭喜！您已完成该岗位全部题目的复习！");
      goHome();
    }
  }
}

function prevQ() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

// 结算成绩单
function renderQuizResult() {
  const bank = getCurrentBank();
  let correctCount = 0;
  bank.forEach((q, idx) => {
    if (userAnswers[idx] && userAnswers[idx].toUpperCase() === q.answer.toUpperCase()) {
      correctCount++;
    }
  });
  const score = Math.round((correctCount / bank.length) * 100);

  const resultHtml = `
    <div style="background:#fff; border-radius:var(--radius-md); padding:24px; text-align:center; box-shadow:var(--shadow-sm);">
      <h3 style="font-size:20px; color:var(--text-main); margin-bottom:8px;">测验完成</h3>
      <div style="font-size:42px; font-weight:800; color:var(--primary); margin:12px 0;">${score}<span style="font-size:16px;">分</span></div>
      <p style="color:#64748b; font-size:14px; margin-bottom:20px;">答对 ${correctCount} 题 / 共 ${bank.length} 题</p>
      <div style="display:flex; gap:10px;">
        <button class="btn-main" onclick="startQuiz()">重新测试</button>
        <button class="btn-secondary" onclick="startStudy()">错题背诵</button>
      </div>
    </div>
  `;
  document.getElementById("screen-body").innerHTML = resultHtml;
  document.getElementById("bottom-bar").innerHTML = `<button class="btn-main" onclick="goHome()">返回岗位首页</button>`;
}

// 初始化二维码

  const targetUrl = "https://stefanie2027.github.io/rochetest-revise/";
  document.getElementById("qrcode").innerHTML = "";
  new QRCode(document.getElementById("qrcode"), {
    text: targetUrl,
    width: 150,
    height: 150,
    colorDark: "#000000",
    colorLight: "#ffffff"
  });
}

function copyShareUrl() {
  navigator.clipboard.writeText("https://stefanie2027.github.io/rochetest-revise/").then(() => {
    alert("答题链接已复制！");
  });
}

function downloadQRCode() {
  const img = document.querySelector("#qrcode img");
  if (img) {
    const a = document.createElement("a");
    a.href = img.src;
    a.download = "罗氏测评二维码.png";
    a.click();
  }
}

window.onload = function() {
  initQRCode();
  renderHome();
};
